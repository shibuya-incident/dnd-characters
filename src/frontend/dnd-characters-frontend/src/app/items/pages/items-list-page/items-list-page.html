<div class="items-list-page-container">
    <div class="upper-section">
        <div class="title">
            <p class="section">Items</p>
            <a routerLink="/items/create" class="create-button">
                <img class="create-button-icon" src="/logos/add_logo.svg" alt="Create Item Icon">
            </a>
        </div>
        <div class="fields">
            <div class="id">
                <p>Id</p>
                <img class="sorting-icon" src="/logos/sorting_logo.svg" alt="Sorting Logo">
                <img class="sort-arrow-icon" src="/logos/sort_arrow_logo.svg" alt="Sorting Arrow">
            </div>
            <div class="name">
                <p>Name</p>
                <img class="sorting-icon" src="/logos/sorting_logo.svg" alt="Sorting Logo">
                <img class="sort-arrow-icon" src="/logos/sort_arrow_logo.svg" alt="Sorting Arrow">
            </div>
            <div class="type">
                <p>Type</p>
                <img class="sorting-icon" src="/logos/sorting_logo.svg" alt="Sorting Logo">
                <img class="sort-arrow-icon" src="/logos/sort_arrow_logo.svg" alt="Sorting Arrow">
            </div>
            <div class="created-at">
                <p>Created At</p>
                <img class="sorting-icon" src="/logos/sorting_logo.svg" alt="Sorting Logo">
                <img class="sort-arrow-icon" src="/logos/sort_arrow_logo.svg" alt="Sorting Arrow">
            </div>
            <div class="actions">
                <p>Actions</p>
            </div>
        </div>
    </div>

    <div class="items-section">
        @if (isLoading()) {
            <app-loader message="Loading items…" />
        } @else if (error(); as errorMessage) {
            <p class="error" role="alert">{{ errorMessage }}</p>
        } @else {
            <div class="items-list">
                @for (item of items()?.items; track item.id) {
                    <a routerLink='/items/{{ item.id }}' class="item-card">
                        <img class="item-image" src="logos/placeholder_image.png" alt="Item Image">
                        <p class="id-value">{{item.id}}</p>
                        <p class="name-value">{{ item.name }}</p>
                        <p class="type-value">{{ item.itemType}}</p>
                        <p class="created-at-value">{{ item.createdAt | date:'shortDate'}}</p>
                        <div class="action-icons">
                            <a routerLink="/items/put">
                                <img class="edit-icon" src="logos/edit_icon.svg" alt="Edit Icon">
                            </a>
                            <a routerLink="/items/delete">    
                                <img class="delete-icon" src="logos/delete_icon.svg" alt="Delete Icon">
                            </a>
                        </div>
                    </a>
                }
            </div>
        }   
    </div>

    <div class="pagination-section">
        
    </div>

<!-- Pagination Section 
    <div class="pagination-section">
        @if (pagination().totalPages > 1) {
            <button class="pagination-button" disabled={pagination().currentPage === 1} onClick={() => goToPage(pagination().currentPage - 1)}>Previous</button>
            <span>Page {{ pagination().currentPage }} of {{ pagination().totalPages }}</span>
            <button class="pagination-button" disabled={pagination().currentPage === pagination().totalPages} onClick={() => goToPage(pagination().currentPage + 1)}>Next</button>
        }
    </div> 
-->       
</div>
