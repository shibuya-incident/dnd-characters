<div class="weapon-detail-page-container">
    <img class="background-image" src="/logos/vine_background.svg" alt="Background Image">
    <div class="name">
        <p>Stormbringer</p>
        <img class="edit-weapon-icon" src="/logos/edit_detail_icon.svg" alt="Edit Weapon Icon">
    </div>

    <div class="weapon-card">
        <div class="weapon-info">
            <img class="weapon-image" src="/logos/placeholder_image.png" alt="Weapon Image">
            <div class="attributes">
                <div class="upper-section">
                    <div class="section">
                        <p class="property">Type</p>
                        <p class="property-value">Longsword</p>
                    </div>
                    <div class="section">
                        <p class="property">Properties</p>
                        <p class="property-value">Versatile</p>
                    </div>
                    <div class="section">
                        <p class="property">Weight</p>
                        <p class="property-value">2 Pounds</p>
                    </div>
                </div>

                <div class="lower-section">
                    <div class="section">
                        <p class="property">Description</p>
                        <p class="description-value"> A sword that can control gravity. However, it cannot be separated from its counterpart or else it will go berserk</p>
                    </div>
                </div>  
            </div>   
        </div>       
        <span class="upload-image">Upload image</span>
    </div>
</div>
