<div class="weapons-list-page-container">
    <div class="upper-section">
        <div class="title">
            <p class="section">Weapons</p>
            <a routerLink="/weapons/create" class="create-button">
                <img class="create-button-icon" src="/logos/add_logo.svg" alt="Create Weapon Icon">
            </a>
        </div>
        <div class="fields">
            <div class="id">
                <p>Id</p>
                <img class="sorting-icon" src="/logos/sorting_logo.svg" alt="Sorting Logo">
                <img class="sort-arrow-icon" src="/logos/sort_arrow_logo.svg" alt="Sorting Arrow">
            </div>
            <div class="name">
                <p>Name</p>
                <img class="sorting-icon" src="/logos/sorting_logo.svg" alt="Sorting Logo">
                <img class="sort-arrow-icon" src="/logos/sort_arrow_logo.svg" alt="Sorting Arrow">
            </div>
            <div class="type">
                <p>Type</p>
                <img class="sorting-icon" src="/logos/sorting_logo.svg" alt="Sorting Logo">
                <img class="sort-arrow-icon" src="/logos/sort_arrow_logo.svg" alt="Sorting Arrow">
            </div>
            <div class="created-at">
                <p>Created At</p>
                <img class="sorting-icon" src="/logos/sorting_logo.svg" alt="Sorting Logo">
                <img class="sort-arrow-icon" src="/logos/sort_arrow_logo.svg" alt="Sorting Arrow">
            </div>
            <div class="actions">
                <p>Actions</p>
            </div>
        </div>
    </div>

    <a routerLink="/weapons/:id" class="weapons-section">
        <div class="weapons-list">
            <img class="weapon-image" src="logos/sidebar_logo.svg" alt="Weapon Image">
            <p class="id-value">1</p>
            <p class="name-value">Stormbringer</p>
            <p class="type-value">Sword</p>
            <p class="created-at-value">22/10/2026</p>
            <div class="action-icons">
                <img class="edit-icon" src="logos/edit_icon.svg" alt="Edit Icon">
                <img class="delete-icon" src="logos/delete_icon.svg" alt="Delete Icon">
            </div>
        </div>
    </a>
